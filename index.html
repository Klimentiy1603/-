<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Фотографии ремонта</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 25px auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.09);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .description {
      margin: 0 0 25px;
      color: #5b6475;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 22px;
    }

    label.field-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 12px 15px;
      border: 2px solid #d7dce5;
      border-radius: 10px;
      font-size: 22px;
      letter-spacing: 5px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    .hint {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    .file-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .file-button,
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .file-button {
      border: 2px solid #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .primary-button {
      margin-top: 18px;
      background: #2563eb;
      color: #ffffff;
    }

    .zip-button {
      margin-top: 12px;
      background: #15803d;
      color: #ffffff;
    }

    button:disabled,
    .file-button.disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .selected-files {
      margin: 15px 0 0;
      padding: 0;
      list-style: none;
    }

    .selected-files li {
      margin-top: 7px;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 14px;
    }

    .empty-list {
      color: #6b7280;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #eef2f7;
      line-height: 1.45;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .separator {
      height: 1px;
      margin: 26px 0;
      background: #e5e7eb;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 8px auto;
        padding: 20px;
      }

      h1 {
        font-size: 25px;
      }

      .file-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Фотографии ремонта</h1>

    <p class="description">
      Введите шестизначный гаражный номер, выберите фотографии
      и загрузите их. Все фотографии указанного номера можно
      скачать одним ZIP-файлом.
    </p>

    <div class="field">
      <label class="field-label" for="garageNumber">
        Гаражный номер
      </label>

      <input
        id="garageNumber"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="off"
        placeholder="000000"
      >

      <div class="hint">
        Необходимо ввести ровно 6 цифр. Например: 012345.
      </div>
    </div>

    <div class="field">
      <span class="field-label">Добавление фотографий</span>

      <div class="file-buttons">
        <label class="file-button" for="cameraInput">
          Сделать фото
        </label>

        <input
          id="cameraInput"
          type="file"
          accept="image/*"
          capture="environment"
        >

        <label class="file-button" for="galleryInput">
          Выбрать из галереи
        </label>

        <input
          id="galleryInput"
          type="file"
          accept="image/*"
          multiple
        >
      </div>

      <ul id="selectedFiles" class="selected-files">
        <li class="empty-list">Фотографии ещё не выбраны.</li>
      </ul>

      <button
        id="uploadButton"
        class="primary-button"
        type="button"
        disabled
      >
        Загрузить фотографии
      </button>
    </div>

    <div class="separator"></div>

    <button
      id="downloadButton"
      class="zip-button"
      type="button"
      disabled
    >
      Скачать все фото этого номера в ZIP
    </button>

    <div id="status" class="status info">
      Подключение к хранилищу…
    </div>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      listAll,
      getDownloadURL,
      getMetadata
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";


    /*
      ВАЖНО:
      замените значения ниже настройками вашего приложения Firebase.
    */
    const firebaseConfig = {
      apiKey: "ВСТАВЬТЕ_API_KEY",
      authDomain: "ВСТАВЬТЕ_AUTH_DOMAIN",
      projectId: "ВСТАВЬТЕ_PROJECT_ID",
      storageBucket: "ВСТАВЬТЕ_STORAGE_BUCKET",
      messagingSenderId: "ВСТАВЬТЕ_MESSAGING_SENDER_ID",
      appId: "ВСТАВЬТЕ_APP_ID"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);

    const garageNumberInput =
      document.getElementById("garageNumber");

    const cameraInput =
      document.getElementById("cameraInput");

    const galleryInput =
      document.getElementById("galleryInput");

    const selectedFilesElement =
      document.getElementById("selectedFiles");

    const uploadButton =
      document.getElementById("uploadButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const statusElement =
      document.getElementById("status");

    let selectedFiles = [];
    let firebaseReady = false;
    let operationInProgress = false;


    function setStatus(message, type = "info") {
      statusElement.textContent = message;
      statusElement.className = "status " + type;
    }


    function updateControls() {
      uploadButton.disabled =
        !firebaseReady ||
        operationInProgress ||
        selectedFiles.length === 0;

      downloadButton.disabled =
        !firebaseReady ||
        operationInProgress;

      cameraInput.disabled = operationInProgress;
      galleryInput.disabled = operationInProgress;
      garageNumberInput.disabled = operationInProgress;
    }


    function getGarageNumber() {
      const garageNumber = garageNumberInput.value.trim();

      if (!/^[0-9]{6}$/.test(garageNumber)) {
        setStatus(
          "Введите гаражный номер, состоящий ровно из 6 цифр.",
          "error"
        );

        garageNumberInput.focus();
        return null;
      }

      return garageNumber;
    }


    function formatFileSize(bytes) {
      if (bytes < 1024) {
        return bytes + " Б";
      }

      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " КБ";
      }

      return (bytes / 1024 / 1024).toFixed(1) + " МБ";
    }


    function showSelectedFiles() {
      selectedFilesElement.innerHTML = "";

      if (selectedFiles.length === 0) {
        const item = document.createElement("li");
        item.className = "empty-list";
        item.textContent = "Фотографии ещё не выбраны.";
        selectedFilesElement.appendChild(item);
        updateControls();
        return;
      }

      selectedFiles.forEach((file, index) => {
        const item = document.createElement("li");

        item.textContent =
          (index + 1) +
          ". " +
          file.name +
          " — " +
          formatFileSize(file.size);

        selectedFilesElement.appendChild(item);
      });

      updateControls();
    }


    function addFiles(fileList) {
      const maximumFileSize = 20 * 1024 * 1024;
      const newFiles = Array.from(fileList);
      let rejectedFiles = 0;

      newFiles.forEach((file) => {
        const isImage = file.type.startsWith("image/");
        const validSize = file.size <= maximumFileSize;

        if (isImage && validSize) {
          selectedFiles.push(file);
        } else {
          rejectedFiles++;
        }
      });

      showSelectedFiles();

      if (rejectedFiles > 0) {
        setStatus(
          "Некоторые файлы не добавлены. Разрешены только изображения до 20 МБ.",
          "error"
        );
      } else if (newFiles.length > 0) {
        setStatus(
          "Выбрано фотографий: " + selectedFiles.length + ".",
          "info"
        );
      }
    }


    function getFileExtension(file) {
      const parts = file.name.split(".");

      if (parts.length > 1) {
        const extension = parts
          .pop()
          .replace(/[^a-zA-Z0-9]/g, "")
          .toLowerCase()
          .slice(0, 8);

        if (extension) {
          return extension;
        }
      }

      if (file.type === "image/png") {
        return "png";
      }

      if (file.type === "image/webp") {
        return "webp";
      }

      if (file.type === "image/heic") {
        return "heic";
      }

      return "jpg";
    }


    function createUniqueFileName(file) {
      const extension = getFileExtension(file);
      const uniquePart =
        typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : Math.random().toString(36).slice(2);

      return Date.now() + "_" + uniquePart + "." + extension;
    }


    function cleanArchiveFileName(fileName) {
      return fileName.replace(/[\\/:*?"<>|]/g, "_");
    }


    garageNumberInput.addEventListener("input", () => {
      garageNumberInput.value = garageNumberInput.value
        .replace(/\D/g, "")
        .slice(0, 6);
    });


    cameraInput.addEventListener("change", () => {
      addFiles(cameraInput.files);
      cameraInput.value = "";
    });


    galleryInput.addEventListener("change", () => {
      addFiles(galleryInput.files);
      galleryInput.value = "";
    });


    uploadButton.addEventListener("click", async () => {
      const garageNumber = getGarageNumber();

      if (!garageNumber) {
        return;
      }

      if (selectedFiles.length === 0) {
        setStatus(
          "Сначала сделайте фото или выберите фотографии.",
          "error"
        );
        return;
      }

      operationInProgress = true;
      updateControls();

      try {
        const filesForUpload = [...selectedFiles];

        for (
          let index = 0;
          index < filesForUpload.length;
          index++
        ) {
          const file = filesForUpload[index];
          const uniqueFileName = createUniqueFileName(file);

          const fileReference = ref(
            storage,
            "garage/" +
              garageNumber +
              "/" +
              uniqueFileName
          );

          setStatus(
            "Загрузка фотографии " +
              (index + 1) +
              " из " +
              filesForUpload.length +
              "…",
            "info"
          );

          await uploadBytes(fileReference, file, {
            contentType: file.type,
            customMetadata: {
              garageNumber: garageNumber,
              originalName: file.name
            }
          });
        }

        selectedFiles = [];
        showSelectedFiles();

        setStatus(
          "Все фотографии успешно загружены. Гаражный номер: " +
            garageNumber +
            ".",
          "success"
        );
      } catch (error) {
        console.error(error);

        setStatus(
          "Не удалось загрузить фотографии. Проверьте настройки Firebase Storage и правила доступа. Код: " +
            (error.code || error.message),
          "error"
        );
      } finally {
        operationInProgress = false;
        updateControls();
      }
    });


    downloadButton.addEventListener("click", async () => {
      const garageNumber = getGarageNumber();

      if (!garageNumber) {
        return;
      }

      operationInProgress = true;
      updateControls();

      try {
        setStatus(
          "Поиск фотографий для номера " +
            garageNumber +
            "…",
          "info"
        );

        const folderReference = ref(
          storage,
          "garage/" + garageNumber
        );

        const result = await listAll(folderReference);

        if (result.items.length === 0) {
          setStatus(
            "Для гаражного номера " +
              garageNumber +
              " фотографии не найдены.",
            "error"
          );
          return;
        }

        const zip = new JSZip();

        for (
          let index = 0;
          index < result.items.length;
          index++
        ) {
          const fileReference = result.items[index];

          setStatus(
            "Подготовка файла " +
              (index + 1) +
              " из " +
              result.items.length +
              "…",
            "info"
          );

          const [downloadUrl, metadata] = await Promise.all([
            getDownloadURL(fileReference),
            getMetadata(fileReference)
          ]);

          const response = await fetch(downloadUrl);

          if (!response.ok) {
            throw new Error(
              "Не удалось скачать файл " + fileReference.name
            );
          }

          const fileBlob = await response.blob();

          const originalName =
            metadata.customMetadata?.originalName ||
            fileReference.name;

          const archiveFileName =
            String(index + 1).padStart(3, "0") +
            "_" +
            cleanArchiveFileName(originalName);

          zip.file(archiveFileName, fileBlob);
        }

        setStatus(
          "Создание ZIP-архива…",
          "info"
        );

        const archiveBlob = await zip.generateAsync(
          {
            type: "blob",
            compression: "DEFLATE",
            compressionOptions: {
              level: 6
            }
          },
          (progress) => {
            setStatus(
              "Создание ZIP-архива: " +
                Math.round(progress.percent) +
                "%",
              "info"
            );
          }
        );

        const temporaryUrl =
          URL.createObjectURL(archiveBlob);

        const link = document.createElement("a");
        link.href = temporaryUrl;
        link.download =
          "garage-" + garageNumber + "-photos.zip";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(temporaryUrl);
        }, 1000);

        setStatus(
          "Архив подготовлен. Фотографий: " +
            result.items.length +
            ".",
          "success"
        );
      } catch (error) {
        console.error(error);

        setStatus(
          "Не удалось создать ZIP-архив. Проверьте подключение и правила Firebase. Код: " +
            (error.code || error.message),
          "error"
        );
      } finally {
        operationInProgress = false;
        updateControls();
      }
    });


    async function startApplication() {
      try {
        await signInAnonymously(auth);

        firebaseReady = true;
        updateControls();

        setStatus(
          "Сайт готов к работе.",
          "success"
        );
      } catch (error) {
        console.error(error);

        setStatus(
          "Не удалось подключиться к Firebase. Проверьте firebaseConfig, Anonymous Authentication и разрешённый домен. Код: " +
            (error.code || error.message),
          "error"
        );
      }
    }


    startApplication();
  </script>
</body>
</html>
